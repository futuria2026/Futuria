<!DOCTYPE html>
<html lang="es">

<!--

  la información de la página para el navegador: el título de la pestaña y la
  hoja de estilos del registro

-->
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Futuria — Registro</title>
  <link rel="stylesheet" href="../assets/css/registro.css">
</head>
<body>

  <!--

    las tres manchas de color borrosas que se mueven despacio en el fondo

  -->
  <div class="bg-blobs">
    <span class="blob blob-1"></span>
    <span class="blob blob-2"></span>
    <span class="blob blob-3"></span>
  </div>

  <!--

    la tarjeta blanca del registro: el logo, el título "Crea tu cuenta", el
    formulario y los enlaces de abajo

  -->
  <main class="card">
    <div class="logo-wrap">
      <img src="../assets/img/logo-futuria.jpeg" alt="Futuria" class="logo" />
    </div>
    <h1>Crea tu cuenta</h1>
    <p class="subtitle">Únete a <span class="brand">Futuria</span> y comienza tu viaje</p>

    <!--

      el formulario de registro con nombre completo, correo, usuario,
      contraseña y confirmación

      se envía a api/registro.php, que crea la cuenta y muestra el resultado.
      novalidate apaga los avisos propios del navegador; los errores los
      muestra registro.js debajo de cada campo (en los <small class="error">)

    -->
    <form id="signupForm" action="../api/registro.php" method="POST" novalidate>
      <div class="field">
        <label for="fullname">Nombre completo</label>
        <input type="text" id="fullname" name="fullname" placeholder="Ej. Ana García" required />
        <small class="error" data-for="fullname"></small>
      </div>

      <div class="field">
        <label for="email">Correo electrónico</label>
        <input type="email" id="email" name="email" placeholder="tu@correo.com" required />
        <small class="error" data-for="email"></small>
      </div>

      <div class="field">
        <label for="username">Nombre de usuario</label>
        <input type="text" id="username" name="username" placeholder="@usuario" required />
        <small class="error" data-for="username"></small>
      </div>

      <div class="field">
        <label for="password">Contraseña</label>
        <input type="password" id="password" name="password" placeholder="••••••••" required />
        <small class="error" data-for="password"></small>
      </div>

      <div class="field">
        <label for="confirm">Confirmar contraseña</label>
        <input type="password" id="confirm" name="confirm" placeholder="••••••••" required />
        <small class="error" data-for="confirm"></small>
      </div>

      <button type="submit" class="submit-btn">Registrarme</button>

      <p class="login-link"><a href="../index.html">← Volver al inicio</a></p>

      <!--

        el enlace para iniciar sesión; todavía no lleva a ninguna página

      -->
      <p class="login-link">¿Ya tienes cuenta? <a href="#">Inicia sesión</a></p>
    </form>
  </main>

  <!--

    el script que revisa los campos antes de enviar

  -->
  <script src="../assets/js/registro.js"></script>
</body>
</html>
