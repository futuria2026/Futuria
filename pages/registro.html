<!DOCTYPE html>
<html lang="es">

<!--

  la información de la página para el navegador: el título de la pestaña y la
  hoja de estilos del registro

-->
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Futuria — Registro</title>
  <link rel="icon" href="../assets/img/logo-futuria.jpeg" type="image/jpeg">
  <link rel="stylesheet" href="../assets/css/registro.css">
</head>
<body>

  <!--

    las tres manchas de color borrosas que se mueven despacio en el fondo

  -->
  <div class="bg-blobs">
    <span class="blob blob-1"></span>
    <span class="blob blob-2"></span>
    <span class="blob blob-3"></span>
  </div>

  <!--

    la tarjeta blanca del registro: el logo, el título "Crea tu cuenta", el
    formulario y los enlaces de abajo

  -->
  <main class="card">
    <div class="logo-wrap">
      <img src="../assets/img/logo-futuria.jpeg" alt="Futuria" class="logo" />
    </div>
    <h1>Crea tu cuenta</h1>
    <p class="subtitle">Únete a <span class="brand">Futuria</span> y comienza tu viaje</p>

    <!--

      el formulario de registro con nombre, correo, contraseña y confirmación

      cuenta.js lo revisa y lo envía a api/auth.php (data-accion="registro").
      Al crear la cuenta la sesión queda iniciada. novalidate apaga los avisos
      propios del navegador; los errores los muestra cuenta.js debajo de cada
      campo (en los <small class="error">) y los del servidor en el aviso de
      arriba del botón

    -->
    <form id="formCuenta" data-accion="registro" novalidate>
      <div class="field">
        <label for="nombre">Nombre</label>
        <input type="text" id="nombre" name="nombre" placeholder="Ej. Ana García" autocomplete="name" maxlength="100" required />
        <small class="error" data-for="nombre"></small>
      </div>

      <div class="field">
        <label for="correo">Correo electrónico</label>
        <input type="email" id="correo" name="correo" placeholder="tu@correo.com" autocomplete="email" maxlength="150" required />
        <small class="error" data-for="correo"></small>
      </div>

      <div class="field">
        <label for="contrasena">Contraseña</label>
        <input type="password" id="contrasena" name="contrasena" placeholder="••••••••" autocomplete="new-password" required />
        <small class="error" data-for="contrasena"></small>
      </div>

      <div class="field">
        <label for="confirmar">Confirmar contraseña</label>
        <input type="password" id="confirmar" name="confirmar" placeholder="••••••••" autocomplete="new-password" required />
        <small class="error" data-for="confirmar"></small>
      </div>

      <p class="aviso-form" id="avisoForm" hidden></p>

      <button type="submit" class="submit-btn">Registrarme</button>

      <p class="login-link"><a href="../index.html">← Volver al inicio</a></p>

      <p class="login-link">¿Ya tienes cuenta? <a href="login.html" data-conserva-volver>Inicia sesión</a></p>
    </form>
  </main>

  <!--

    el script que revisa el formulario y lo envía

  -->
  <script src="../assets/js/cuenta.js"></script>
</body>
</html>
