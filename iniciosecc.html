      padding:10px 16px;background:rgba(75,28,113,.92);backdrop-filter:blur(10px);
      overflow-x:auto;white-space:nowrap;box-shadow:0 4px 16px rgba(21,32,105,.25)}
    .menu-top .menu-marca{display:flex;align-items:center;gap:8px;color:#fff;font-weight:700;
      text-decoration:none;letter-spacing:1px;margin-right:12px}
    .menu-top .menu-marca img{width:32px;height:32px;border-radius:50%;object-fit:cover;background:#fff}
    .menu-top a.menu-link{color:#fff;text-decoration:none;font-size:.9rem;padding:8px 12px;border-radius:999px;transition:background .2s}
    .menu-top a.menu-link:hover{background:rgba(255,255,255,.2)}
    .menu-top a.menu-link.activo{background:#FE6A00;font-weight:700}
    body{padding-top:90px}
  </style>
</head>
<body>
  <nav class="menu-top" aria-label="Menú principal">
    <a class="menu-marca" href="index.html"><img src="img/logo-futuria.jpeg" alt="Futuria">FUTURIA</a>
    <a class="menu-link" href="index.html">Quiénes somos</a>
    <a class="menu-link" href="pagina2.html">Integrantes</a>

    <a class="menu-link" href="ia.html">IA</a>
    <a class="menu-link" href="contacto.html">Contáctanos</a>
  </nav>

  <div class="bg-blobs">
    <span class="blob blob-1"></span>
    <span class="blob blob-2"></span>
    <span class="blob blob-3"></span>
  </div>


  <main class="card">
    <div class="logo-wrap">
      <img src="img/logo-futuria.jpeg" alt="Futuria" class="logo" />
    </div>
    <h1>Crea tu cuenta</h1>
    <p class="subtitle">Únete a <span class="brand">Futuria</span> y comienza tu viaje</p>

    <form id="signupForm" action="iniciosecc.php" method="POST" novalidate>
      <div class="field">
        <label for="fullname">Nombre completo</label>
        <input type="text" id="fullname" name="fullname" placeholder="Ej. Ana García" required />
        <small class="error" data-for="fullname"></small>
      </div>

      <div class="field">
        <label for="email">Correo electrónico</label>
        <input type="email" id="email" name="email" placeholder="tu@correo.com" required />
        <small class="error" data-for="email"></small>
      </div>

      <div class="field">
        <label for="username">Nombre de usuario</label>
        <input type="text" id="username" name="username" placeholder="@usuario" required />
        <small class="error" data-for="username"></small>
      </div>

      <div class="field">
        <label for="password">Contraseña</label>
        <input type="password" id="password" name="password" placeholder="••••••••" required />
        <small class="error" data-for="password"></small>
      </div>

      <div class="field">
        <label for="confirm">Confirmar contraseña</label>
        <input type="password" id="confirm" name="confirm" placeholder="••••••••" required />
        <small class="error" data-for="confirm"></small>
      </div>

      <button type="submit" class="submit-btn">Registrarme</button>

      <p class="login-link"><a href="index.html">← Volver al inicio</a></p>

      <p class="login-link">¿Ya tienes cuenta? <a href="#">Inicia sesión</a></p>
    </form>
  </main>

  <script src="iniciosecc.js"></script>
</body>
</html>
