<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Futuria — Registro</title>
  <link rel="stylesheet" href="iniciosecc.css" />
</head>
<body>
  <div class="bg-blobs">
    <span class="blob blob-1"></span>
    <span class="blob blob-2"></span>
    <span class="blob blob-3"></span>
  </div>


  <main class="card">
    <div class="logo-wrap">
      <img src="img/logo-futuria.jpeg" alt="Futuria" class="logo" />
    </div>
    <h1>Crea tu cuenta</h1>
    <p class="subtitle">Únete a <span class="brand">Futuria</span> y comienza tu viaje</p>

    <form id="signupForm" action="iniciosecc.php" method="POST" novalidate>
      <div class="field">
        <label for="fullname">Nombre completo</label>
        <input type="text" id="fullname" name="fullname" placeholder="Ej. Ana García" required />
        <small class="error" data-for="fullname"></small>
      </div>

      <div class="field">
        <label for="email">Correo electrónico</label>
        <input type="email" id="email" name="email" placeholder="tu@correo.com" required />
        <small class="error" data-for="email"></small>
      </div>

      <div class="field">
        <label for="username">Nombre de usuario</label>
        <input type="text" id="username" name="username" placeholder="@usuario" required />
        <small class="error" data-for="username"></small>
      </div>

      <div class="field">
        <label for="password">Contraseña</label>
        <input type="password" id="password" name="password" placeholder="••••••••" required />
        <small class="error" data-for="password"></small>
      </div>

      <div class="field">
        <label for="confirm">Confirmar contraseña</label>
        <input type="password" id="confirm" name="confirm" placeholder="••••••••" required />
        <small class="error" data-for="confirm"></small>
      </div>

      <button type="submit" class="submit-btn">Registrarme</button>

      <p class="login-link">¿Ya tienes cuenta? <a href="#">Inicia sesión</a></p>
    </form>
  </main>

  <script src="script.js"></script>
</body>
</html>
